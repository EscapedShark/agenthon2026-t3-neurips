[package]
name = "fastsim"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
toml = "1.1.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
# Phase marks for measurement builds (see src/marks.rs); off in the submission.
marks = []
# Event counters on top of the marks (they cost an atomic add per event).
counters = ["marks"]

[dev-dependencies]
bytes = "1.12.1"
parquet = { version = "60.0.0", default-features = false, features = ["snap"] }

[profile.profiling]
inherits = "release"
debug = true
